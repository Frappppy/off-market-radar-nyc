# WHAT:      Daily pipeline workflow — scrape -> clean -> store at 10:00 UTC
#            (cron "0 10 * * *"), plus manual workflow_dispatch, on windows-latest.
# WHY:       The scheduled run that keeps the site fed. It holds the only
#            production credentials in the repo, and those are referenced ONLY
#            through GitHub's encrypted secrets context below — never
#            hard-coded, never written to any file.
#            Verified by: test_only_the_six_secrets_referenced + test_no_leaked_values
#            (tests/test_workflow_yaml.py).
#            The run steps use the venv interpreter explicitly: `py -3` would
#            resolve to the runner's base Python (verified: py ignores
#            VIRTUAL_ENV) and would miss the packages installed into .venv.
#            Verified by: test_schedule_and_stages (pins the venv invocations).
#            Setup: docs/deploy_github.md.
# INPUTS:    6 GitHub Actions secrets (DATABASE_URL + the DATAIMPULSE_* five),
#            a checkout of this repo, requirements.txt.
# OUTPUTS:   one pipeline run per trigger; any failed stage fails the job.
# CALLERS:   the GitHub scheduler; humans via workflow_dispatch.

name: daily_pipeline

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC every day
  workflow_dispatch:        # manual runs for testing

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
      DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
      DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
      DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
      DATAIMPULSE_COUNTRY: ${{ secrets.DATAIMPULSE_COUNTRY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Create venv
        run: py -3 -m venv .venv

      - name: Install dependencies
        run: .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run daily pipeline
        run: .venv\Scripts\python.exe scripts\run_daily.py
