# Pytest configuration — Project 1: Off-Market Radar NYC
#
# WHY THIS FILE EXISTS (Phase 0 of the refactor, see REFACTOR_PLAN.md):
#   Previously the only pytest configuration lived in `tests/conftest.py`, which
#   mutated `sys.path` at import time so that `import src.*` resolved from the
#   repo root. That hack is being replaced by the declarative `pythonpath` option
#   below, which does the same job without runtime magic and lets every test file
#   (and any future test directory) import `src.*` uniformly.
#
# INVARIANTS: none of the settings below may weaken test discovery — the suite
# must still collect every `tests/test_*.py` file.

[tool.pytest.ini_options]
# Repo root on sys.path so `import src.scrape / src.clean / src.store` works.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

# NOTE: no custom markers are registered yet. If credential-dependent tests
# (see `tests/test_scrape.py` proxy/scrub tests, which silently `pytest.skip`
# without DATAIMPULSE_* env vars) are ever given a marker, register it here so
# `pytest -m "not db"` style selection works and skips become visible.

[tool.mypy]
# MUST match the interpreter checks.yml installs (and the runtime itself:
# README, docs/decisions.md §6 — Python 3.14, CI pins "3.14").
#
# It used to say "3.11", and that was not a style choice but a broken gate: the
# first CI run with mypy in it (40197244569, 2026-10-25) died on
#   .venv\Lib\site-packages\numpy\__init__.pyi:737: error: Type statement is
#   only supported in Python 3.12 and greater  [syntax]
#   Found 1 error in 1 file (errors prevented further checking)
# because numpy==2.5.4 ships PEP 695 `type` aliases in its stubs, which mypy
# refuses to parse below a 3.12 target. So the gate was red AND vacuous — it
# never reached a single file under src/. tests/test_workflow_yaml.py
# ::test_tool_versions_match_the_ci_interpreter now pins these numbers to the
# workflow so they cannot silently drift apart again.
python_version = "3.14"
namespace_packages = true
explicit_package_bases = true
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
# The CI gate is `mypy src` — the nightly pipeline's own code. `files` makes a
# bare `mypy` reproduce it. scripts/ and dashboard/ are NOT in scope yet: they
# carry 12 known errors (measured 2026-10-25) and a gate that starts red is not
# a gate, so widening is a deliberate later step, not a silent one.
files = ["src"]

# ruff — the CI lint gate (.github/workflows/checks.yml).
#
# `select` is ruff's own default set (E4/E7/E9 + F: syntax errors, unreachable
# code, unused imports/variables, undefined names) because that is the set this
# tree passes CLEAN on today (measured 2026-10-25: 0 findings over
# src/scripts/tests/dashboard). Everything stricter is knowingly deferred and
# measured, not guessed: adding E501 alone is 218 findings, the fuller
# E,F,W,I,UP,B,SIM,C4,RUF set is 282. Widening the list below is how the gate
# grows — the CI command stays `ruff check src scripts tests dashboard`.
[tool.ruff]
# Same rule as mypy's python_version above: the target is the interpreter the
# pipeline actually runs, which checks.yml pins to 3.14. The selected rules
# (E4/E7/E9/F) are version-insensitive, so this is honesty rather than behaviour.
target-version = "py314"
line-length = 100        # documents intent only; E501 is not selected (see above)
src = ["src", "scripts", "tests", "dashboard"]
extend-exclude = ["site", "jobs", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
